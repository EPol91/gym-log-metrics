<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricettario</title>
<style>
:root{
  --bg:#0B0A09;
  --panel:#141210;
  --panel-2:#1C1917;
  --line:#2B2723;
  --line-soft:#211E1B;
  --ink:#F4EFE6;
  --ink-2:#D3CABB;
  --muted:#8E8578;
  --gold:#D4AF37;
  --gold-2:#B8942C;
  --gold-soft:#6E5B22;
  --warn:#C4614A;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---- testata ---- */
header.top{
  position:sticky;top:0;z-index:30;background:rgba(11,10,9,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
}
.top-in{max-width:720px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{
  font-family:var(--serif);font-size:20px;font-weight:600;margin:0;
  letter-spacing:.3px;color:var(--ink);
}
.brand h1 em{font-style:normal;color:var(--gold)}
.brand span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:22px}
nav.tabs button{
  background:none;border:0;padding:0 0 10px;color:var(--muted);
  font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}

/* ---- blocchi ---- */
.card{
  background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:16px;margin-top:14px;
}
.sect{margin-top:24px}
.sect > h2{
  font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 3px;white-space:nowrap;
}
.sect > h2 + p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.45}
.rule{height:1px;background:linear-gradient(90deg,var(--gold-soft),transparent);margin:10px 0 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--ink-2);line-height:1.55}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- controlli ---- */
input,select,textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold-soft)}
input[type=number]{font-family:var(--mono);text-align:right}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}

.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:10px 16px;font-size:15px;min-height:40px;
}
.btn:hover{border-color:var(--gold-soft)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0B0A09;font-weight:600}
.btn.primary:hover{background:var(--gold-2)}
.btn.ghost{background:none;border-color:transparent;padding-left:0;color:var(--muted)}
.btn.ghost:hover{color:var(--gold);border-color:transparent}
.btn.danger{border-color:#4A2E28;color:#D9917E}
.btn.sm{padding:7px 13px;font-size:14px;min-height:34px}
.btn.wide{width:100%;justify-content:center}

/* ---- elenco ricette ---- */
.rlist{display:grid;gap:10px;margin-top:14px}
.ritem{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:15px 17px;text-align:left;width:100%;display:block;
}
.ritem:hover{border-color:var(--gold-soft)}
.ritem h3{font-family:var(--serif);font-size:18px;margin:0;font-weight:600}
.ritem .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ritem .sum{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line-soft);
}
.ritem .sum span{font-size:13px;color:var(--ink-2)}
.ritem .sum b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.ritem .sum span:first-child b{color:var(--gold)}

/* ---- porzioni ---- */
.scaler{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 16px;margin-top:16px;
}
.scaler .lab{font-size:15px;color:var(--ink-2)}
.scaler .factor{font-size:13px;color:var(--muted);margin-top:9px}
.stepper{display:flex;align-items:center;gap:5px}
.stepper button{
  width:40px;height:40px;border-radius:10px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--gold);font-size:20px;line-height:1;
}
.stepper button:hover{border-color:var(--gold-soft)}
.stepper input{
  width:52px;text-align:center;font-family:var(--mono);font-size:18px;
  padding:9px 2px;background:none;border-color:transparent;
}

/* ---- macro ---- */
.macros{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;margin-top:10px;
}
@media(min-width:620px){.macros{grid-template-columns:repeat(4,1fr)}}
.macros .m{background:var(--panel);padding:12px 14px}
.macros .mv{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.4px;line-height:1.15}
.macros .mu{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:3px}
.macros .ml{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.macros .m.gold .mv{color:var(--gold)}
.toggle{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.toggle button{background:none;border:0;border-radius:7px;padding:6px 12px;font-size:14px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--gold);color:#0B0A09;font-weight:600}

/* ---- ingredienti ---- */
.grp{margin-top:18px}
.grp:first-child{margin-top:0}
.grp h4{
  font-family:var(--serif);font-size:15px;color:var(--gold);
  margin:0 0 4px;font-weight:600;
}
.grp .rule{margin-bottom:6px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
ul.ing li:last-child{border-bottom:0;padding-bottom:0}
ul.ing .in{color:var(--ink);line-height:1.4}
ul.ing .q{
  font-family:var(--mono);font-size:15px;color:var(--gold);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
ul.ing .q.warnq{color:var(--warn)}

/* ---- procedimento ---- */
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{
  counter-increment:s;position:relative;padding:11px 0 11px 36px;
  border-bottom:1px solid var(--line-soft);line-height:1.5;
}
ol.steps li:last-child{border-bottom:0;padding-bottom:0}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:11px;width:25px;height:25px;
  border:1px solid var(--gold-soft);border-radius:50%;color:var(--gold);
  font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;
}

/* ---- alimenti ---- */
.search{margin-top:14px}
.frow{
  display:grid;
  grid-template-columns:minmax(0,1fr) 44px 38px 38px 38px;
  gap:9px;align-items:center;width:100%;
}
.foodrow{
  background:none;border:0;border-bottom:1px solid var(--line-soft);
  padding:12px 2px;text-align:left;color:var(--ink);
}
.foodrow:hover{background:var(--panel)}
.foodrow .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.foodrow span+span{
  font-family:var(--mono);font-size:14px;color:var(--ink-2);
  text-align:right;font-variant-numeric:tabular-nums;
}
.foodrow .kc{color:var(--gold);font-weight:600}
.legend{
  padding:0 2px 8px;font-size:12px;color:var(--muted);
  border-bottom:1px solid var(--line);margin-top:14px;
}
.legend span+span{text-align:right;font-size:11px}
.cam{
  width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;
  object-fit:cover;border:1px solid var(--line);display:block;
}
.resrow{
  display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:10px;align-items:center;
  width:100%;background:none;border:0;border-bottom:1px solid var(--line-soft);
  padding:11px 2px;text-align:left;color:var(--ink);
}
.resrow:hover{background:var(--panel-2)}
.resrow .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.resrow .kc{
  font-family:var(--mono);font-size:14px;color:var(--gold);
  text-align:right;font-variant-numeric:tabular-nums;
}
.scanmsg{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0 0 14px}
.scanwarn{font-size:13px;color:var(--warn);line-height:1.45;margin-top:12px}
.divisore{height:1px;background:var(--line);margin:18px 0}
.credit{font-size:11px;color:var(--muted);margin:16px 0 0;text-align:center}
.modal{
  position:fixed;inset:0;z-index:80;background:rgba(6,5,5,.72);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media(min-width:560px){.modal{align-items:center;padding:20px}}
.sheet{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;width:100%;max-width:480px;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;
}
@media(min-width:560px){.sheet{border-radius:16px}}
.sheet h3{font-family:var(--serif);font-size:18px;margin:0 0 3px;font-weight:600}
.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.foodcard{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 16px;margin-top:10px;
}
.foodcard .fname input{
  font-family:var(--serif);font-size:16px;background:none;border-color:transparent;
  padding:0 0 9px;border-radius:0;border-bottom:1px solid var(--line-soft);
}
.foodcard .fname input:focus{border-bottom-color:var(--gold-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:560px){.fgrid{grid-template-columns:repeat(5,1fr)}}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fgrid input,.fgrid select{padding:8px 10px;font-size:15px}
.foodcard .del{margin-top:12px;text-align:right}

/* ---- editor ---- */
.grpbox{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px;margin-top:10px}
.ed-row{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:center;margin-bottom:8px}
.ed-row .x{background:none;border:1px solid var(--line);border-radius:9px;height:40px;color:var(--muted);font-size:18px}
.ed-row .x:hover{color:var(--warn);border-color:#4A2E28}
.ed-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty p{margin:0 0 18px;font-size:15px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;
  background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:11px;
  padding:11px 18px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Ricett<em>a</em>rio</h1><span id="stat"></span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="ricette" aria-selected="true">Ricette</button>
      <button role="tab" data-tab="alimenti" aria-selected="false">Alimenti</button>
      <button role="tab" data-tab="dati" aria-selected="false">Dati</button>
    </nav>
  </div>
</header>

<div class="wrap" id="view"></div>

<script>
/* ---------- storage: window.storage (chat) -> localStorage (PWA) -> memoria ---------- */
const KEY='ricettario:v1';
const Store={
  async get(){
    try{ if(window.storage){ const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){}
    return window.__mem||null;
  },
  async set(o){
    const s=JSON.stringify(o); window.__mem=o;
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

/* ---------- utility ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
function fmt(n,d=1){
  if(!isFinite(n))return '0';
  const r=Math.round(n*Math.pow(10,d))/Math.pow(10,d);
  return String(r).replace('.',',');
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- seconda ricetta: base senza uovo, con olio EVO ---------- */
function recOlio(idOf){
  return {
    id:uid(),
    nome:'Tiramis\u00f9 fit all\u2019olio EVO',
    porzioni:6,
    note:'Usa un olio delicato. Un fruttato intenso si sente anche a 1 g per porzione. L\u2019olio sostituisce il tuorlo nel tenere morbida la base.',
    gruppi:[
      {nome:'Base',items:[
        {f:idOf('Albume'),q:250},{f:idOf('Farina di avena'),q:60},{f:idOf('Whey vaniglia'),q:30},
        {f:idOf('Olio extravergine di oliva'),q:6},{f:idOf('Eritritolo'),q:30},{f:idOf('Lievito per dolci'),q:4}
      ]},
      {nome:'Crema',items:[
        {f:idOf('Skyr naturale'),q:500},{f:idOf('Fiocchi di latte'),q:200},
        {f:idOf('Isolate vaniglia'),q:30},{f:idOf('Eritritolo'),q:30},{f:idOf('Xantana'),q:0.5}
      ]},
      {nome:'Finitura',items:[
        {f:idOf('Caff\u00e8'),q:200},{f:idOf('Cacao amaro'),q:10},{f:idOf('Cioccolato fondente 85%'),q:30}
      ]}
    ],
    passi:[
      'Preleva 50 g di albume e tienilo da parte. Monta il resto a neve ferma.',
      'Mescola farina di avena, whey, eritritolo e lievito con l\u2019albume tenuto da parte e l\u2019olio, fino a ottenere un impasto omogeneo.',
      'Incorpora l\u2019albume montato dal basso verso l\u2019alto.',
      'Versa in teglia 20\u00d720 e cuoci in forno statico a 180 \u00b0C per 12 minuti. Fai raffreddare completamente.',
      'Scola i fiocchi di latte dal liquido e frullali fino a crema liscia.',
      'Unisci skyr, fiocchi frullati, isolate ed eritritolo. Monta aggiungendo la xantana a pioggia.',
      'Taglia la base in 2 strati.',
      'Inzuppa il primo strato nel caff\u00e8, copri con met\u00e0 crema.',
      'Ripeti con il secondo strato e la crema rimanente. Livella bene la superficie.',
      'Spolvera con il cacao amaro.',
      'Frigo 6 ore.',
      'Sciogli il cioccolato a bagnomaria, versalo sulla superficie e stendilo sottile.',
      'Rimetti in frigo 20 minuti, o 10 in freezer, finch\u00e9 non solidifica.'
    ]
  };
}

/* ---------- dati iniziali (valori per 100 g / 100 ml) ---------- */
function seed(){
  const F=(nome,u,kcal,p,c,g)=>({id:uid(),nome,u,kcal,p,c,g});
  const foods=[
    F('Albume','g',52,11,0.7,0.2),
    F('Uovo intero','g',143,12.6,0.7,9.5),
    F('Tuorlo','g',322,15.9,1.1,28.2),
    F('Skyr naturale','g',63,11,4,0.2),
    F('Fiocchi di latte','g',99,11,3.4,4.3),
    F('Ricotta light','g',90,11,4,4),
    F('Quark magro','g',67,12,4,0.3),
    F('Mascarpone','g',450,4.5,3,47),
    F('Whey vaniglia','g',380,80,6,4),
    F('Isolate vaniglia','g',373,90,1,0.5),
    F('Olio extravergine di oliva','g',900,0,0,100),
    F('Farina di avena','g',370,13,60,7),
    F('Farina 00','g',340,10,71,1),
    F('Farina di cocco','g',400,18,22,14),
    F('Farina di lupino','g',380,40,10,10),
    F('Cacao amaro','g',355,20,11,21),
    F('Cioccolato fondente 85%','g',592,10,15,50),
    F('Eritritolo','g',0,0,0,0),
    F('Lievito per dolci','g',0,0,0,0),
    F('Xantana','g',0,0,0,0),
    F('Caffè','ml',0,0,0,0),
    F('Bevanda mandorla non zuccherata','ml',13,0.4,0.3,1.1)
  ];
  const id=n=>foods.find(f=>f.nome===n).id;
  const recipes=[{
    id:uid(),
    nome:'Tiramisù fit',
    porzioni:6,
    note:'Stendi il cioccolato solo dopo il riposo in frigo: sulla crema morbida affonda invece di formare lo strato croccante.',
    gruppi:[
      {nome:'Base',items:[
        {f:id('Albume'),q:200},{f:id('Uovo intero'),q:55},{f:id('Farina di avena'),q:60},
        {f:id('Whey vaniglia'),q:30},{f:id('Eritritolo'),q:30},{f:id('Lievito per dolci'),q:4}
      ]},
      {nome:'Crema',items:[
        {f:id('Skyr naturale'),q:500},{f:id('Fiocchi di latte'),q:200},
        {f:id('Isolate vaniglia'),q:30},{f:id('Eritritolo'),q:30},{f:id('Xantana'),q:0.5}
      ]},
      {nome:'Finitura',items:[
        {f:id('Caffè'),q:200},{f:id('Cacao amaro'),q:10},{f:id('Cioccolato fondente 85%'),q:30}
      ]}
    ],
    passi:[
      'Monta l\u2019albume a neve ferma.',
      'Mescola farina di avena, whey, eritritolo e lievito con l\u2019uovo intero.',
      'Incorpora l\u2019albume dal basso verso l\u2019alto.',
      'Versa in teglia 20\u00d720 e cuoci in forno statico a 180 \u00b0C per 12 minuti. Fai raffreddare completamente.',
      'Scola i fiocchi di latte dal liquido e frullali fino a crema liscia.',
      'Unisci skyr, fiocchi frullati, isolate ed eritritolo. Monta aggiungendo la xantana a pioggia.',
      'Taglia la base in 2 strati.',
      'Inzuppa il primo strato nel caff\u00e8, copri con met\u00e0 crema.',
      'Ripeti con il secondo strato e la crema rimanente. Livella bene la superficie.',
      'Spolvera con il cacao amaro.',
      'Frigo 6 ore.',
      'Sciogli il cioccolato a bagnomaria, versalo sulla superficie e stendilo sottile.',
      'Rimetti in frigo 20 minuti, o 10 in freezer, finch\u00e9 non solidifica.'
    ]
  },recOlio(id)];
  return {foods,recipes};
}

/* ---------- stato ---------- */
let S={foods:[],recipes:[]};
let ui={tab:'ricette',open:null,porz:null,perPorzione:true,editing:null};

async function boot(){
  S=await Store.get()||seed();
  S.foods=S.foods||[];S.recipes=S.recipes||[];
  await migra();
  render();
}

/* aggiunge cio' che manca senza toccare quello che l'utente ha gia' */
function trovaId(nome){
  let f=S.foods.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
  if(!f){f={id:uid(),nome,u:'g',kcal:0,p:0,c:0,g:0};S.foods.push(f);}
  return f.id;
}
async function migra(){
  let mod=false;
  if(!S.foods.some(f=>f.nome.toLowerCase()==='olio extravergine di oliva')){
    S.foods.push({id:uid(),nome:'Olio extravergine di oliva',u:'g',kcal:900,p:0,c:0,g:100});mod=true;
  }
  const n='tiramis\u00f9 fit all\u2019olio evo';
  if(!S.recipes.some(r=>String(r.nome).toLowerCase()===n)){
    S.recipes.push(recOlio(trovaId));mod=true;
  }
  if(mod)await save();
}
const save=()=>Store.set(S);
const food=id=>S.foods.find(f=>f.id===id);

function calc(rec,fattore){
  const t={kcal:0,p:0,c:0,g:0};
  (rec.gruppi||[]).forEach(gr=>gr.items.forEach(it=>{
    const f=food(it.f); if(!f)return;
    const q=num(it.q)*fattore/100;
    t.kcal+=q*num(f.kcal);t.p+=q*num(f.p);t.c+=q*num(f.c);t.g+=q*num(f.g);
  }));
  return t;
}

/* ---------- fotocamera e ricerca prodotto ---------- */
let scanStream=null,scanLoop=null;

function stopScanner(){
  if(scanLoop){clearInterval(scanLoop);scanLoop=null;}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
}

async function avviaScanner(){
  const v=document.getElementById('cam'); if(!v)return;
  if(!('BarcodeDetector' in window)){
    ui.scan={stato:'manuale',msg:'Questo browser non legge i codici a barre. Inserisci il codice a mano.'};
    render();return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=scanStream; await v.play();
  }catch(e){
    ui.scan={stato:'manuale',msg:'Fotocamera non disponibile. Succede aprendo il file dal telefono invece che da un indirizzo web: inserisci il codice a mano.'};
    render();return;
  }
  let det;
  try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }
  catch(e){ det=new BarcodeDetector(); }
  scanLoop=setInterval(async()=>{
    try{
      const c=await det.detect(v);
      if(c&&c.length){stopScanner();cercaProdotto(c[0].rawValue);}
    }catch(e){}
  },400);
}

function normProd(pr){
  const n=pr.nutriments||{};
  const kcal=(n['energy-kcal_100g']!=null)?n['energy-kcal_100g']
    :((n['energy_100g']!=null)?n['energy_100g']/4.184:0);
  return {
    code:pr.code||'',
    nome:[pr.product_name,pr.brands].filter(Boolean).join(' ').trim().slice(0,60),
    u:'g',
    kcal:Math.round(num(kcal)*10)/10,
    p:num(n.proteins_100g),c:num(n.carbohydrates_100g),g:num(n.fat_100g)
  };
}

/* due motori di ricerca: il nuovo, e quello storico come riserva */
async function cercaNome(q){
  q=String(q||'').trim();
  if(q.length<2){
    ui.scan={stato:'errore',msg:'Scrivi almeno due lettere.'};render();return;
  }
  ui.scan={stato:'attesa',msg:'Cerco \u201c'+q+'\u201d nel database\u2026'};render();
  const campi='code,product_name,brands,nutriments';
  const fonti=[
    'https://search.openfoodfacts.org/search?q='+encodeURIComponent(q)+'&page_size=20&fields='+campi,
    'https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+
      '&search_simple=1&action=process&json=1&page_size=20&fields='+campi
  ];
  for(let i=0;i<fonti.length;i++){
    try{
      const r=await fetch(fonti[i]);
      if(!r.ok)continue;
      const j=await r.json();
      const arr=j.hits||j.products||[];
      const lista=arr.map(normProd).filter(x=>x.nome);
      if(lista.length){ui.scan={stato:'risultati',q,lista};render();return;}
    }catch(e){}
  }
  ui.scan={stato:'errore',creabile:true,code:'',
    msg:'Nessun risultato per \u201c'+q+'\u201d. Puoi inserire i valori leggendoli dall\u2019etichetta.'};
  render();
}

async function cercaProdotto(code){
  code=String(code).trim();
  if(!/^[0-9]{6,14}$/.test(code)){
    ui.scan={stato:'errore',msg:'Codice non valido: servono da 6 a 14 cifre.'};render();return;
  }
  S.barcode=S.barcode||{};
  if(S.barcode[code]){
    ui.scan={stato:'conferma',code,dati:Object.assign({},S.barcode[code])};render();return;
  }
  ui.scan={stato:'attesa',code};render();
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+
      '.json?fields=product_name,brands,nutriments');
    const j=await r.json();
    if(!j||!j.product){
      ui.scan={stato:'errore',code,creabile:true,
        msg:'Questo prodotto non c\u2019\u00e8 nel database. Capita spesso con le marche del supermercato. Inserisci i valori dall\u2019etichetta: li salvo sul codice, la prossima volta li ritrovi subito.'};
      render();return;
    }
    const n=j.product.nutriments||{};
    const kcal=(n['energy-kcal_100g']!=null)?n['energy-kcal_100g']
      :((n['energy_100g']!=null)?n['energy_100g']/4.184:0);
    const d={
      nome:[j.product.product_name,j.product.brands].filter(Boolean).join(' ').trim().slice(0,60)||('Prodotto '+code),
      u:'g',
      kcal:Math.round(num(kcal)*10)/10,
      p:num(n.proteins_100g),c:num(n.carbohydrates_100g),g:num(n.fat_100g)
    };
    S.barcode[code]=d;await save();
    ui.scan={stato:'conferma',code,dati:Object.assign({},d)};render();
  }catch(e){
    ui.scan={stato:'errore',msg:'Database non raggiungibile. Serve la connessione a internet per la prima lettura di un prodotto.'};
    render();
  }
}

  <div class="sect">
    <h2>Ripristino</h2>
    <p>Torna alla ricetta e agli alimenti di partenza.</p>
    <div class="card" style="margin-top:0">
      <p class="note" style="margin:0 0 18px">Cancella tutte le ricette e gli alimenti che hai aggiunto. Esporta un backup prima di procedere.</p>
      <button class="btn danger" data-act="reset">Ripristina i dati iniziali</button>
    </div>
  </div>`;
}

/* ---------- eventi ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b)return;
  ui.tab=b.dataset.tab; ui.editing=null; ui.foodOpen=null;
  stopScanner(); ui.scan=null; render();
});

document.getElementById('view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='stop')return;
  if(a==='scan'){ui.scan={stato:'camera'};render();avviaScanner();return;}
  if(a==='scanclose'){stopScanner();ui.scan=null;render();return;}
  if(a==='scanmanual'){stopScanner();ui.scan={stato:'manuale',msg:ui.scan&&ui.scan.msg};render();return;}
  if(a==='screa'){
    ui.scan={stato:'conferma',code:ui.scan.code,
      dati:{nome:'',u:'g',kcal:0,p:0,c:0,g:0}};
    render();return;
  }
  if(a==='scannome'){const el=document.getElementById('nomeprod');cercaNome(el?el.value:'');return;}
  if(a==='scanpick'){
    const x=ui.scan.lista[+b.dataset.i];
    ui.scan={stato:'conferma',code:x.code,
      dati:{nome:x.nome,u:x.u,kcal:x.kcal,p:x.p,c:x.c,g:x.g}};
    render();return;
  }
  if(a==='scango'){const el=document.getElementById('codice');cercaProdotto(el?el.value:'');return;}
  if(a==='scansave'){
    const d=ui.scan.dati;
    if(!String(d.nome).trim()){toast('Serve un nome');return;}
    const nuovo={id:uid(),nome:String(d.nome).trim(),u:d.u||'g',
      kcal:num(d.kcal),p:num(d.p),c:num(d.c),g:num(d.g)};
    S.foods.push(nuovo);
    if(ui.scan.code){
      S.barcode=S.barcode||{};
      S.barcode[ui.scan.code]={nome:nuovo.nome,u:nuovo.u,kcal:nuovo.kcal,p:nuovo.p,c:nuovo.c,g:nuovo.g};
    }
    ui.scan=null;await save();render();toast('Alimento aggiunto');return;
  }
  if(a==='openfood'){ui.foodOpen=b.dataset.id;render();return;}
  if(a==='closefood'){ui.foodOpen=null;render();return;}

  if(a==='open'){ui.open=b.dataset.id;ui.porz=null;render();}
  if(a==='back'){ui.open=null;render();}
  if(a==='per'){ui.perPorzione=true;render();}
  if(a==='tot'){ui.perPorzione=false;render();}
  if(a==='plus'||a==='minus'){
    const r=S.recipes.find(x=>x.id===ui.open);
    const base=Math.max(1,num(r.porzioni)||1);
    ui.porz=Math.max(1,(ui.porz||base)+(a==='plus'?1:-1));render();
  }
  if(a==='new'){
    ui.editing={id:uid(),nome:'',porzioni:4,gruppi:[{nome:'Ingredienti',items:[]}],passi:[],note:'',_new:true};
    ui.open=null;render();
  }
  if(a==='edit'){
    const r=S.recipes.find(x=>x.id===b.dataset.id);
    ui.editing=JSON.parse(JSON.stringify(r));render();
  }
  if(a==='cancel'){ui.editing=null;render();}
  if(a==='addgrp'){ui.editing.gruppi.push({nome:'Nuova sezione',items:[]});render();}
  if(a==='delgrp'){ui.editing.gruppi.splice(+b.dataset.g,1);render();}
  if(a==='additem'){
    if(!S.foods.length){toast('Aggiungi prima un alimento');return;}
    ui.editing.gruppi[+b.dataset.g].items.push({f:S.foods[0].id,q:0});render();
  }
  if(a==='delitem'){ui.editing.gruppi[+b.dataset.g].items.splice(+b.dataset.i,1);render();}
  if(a==='saverec'){
    const r=ui.editing;
    if(!r.nome.trim()){toast('Serve un nome');return;}
    r.porzioni=Math.max(1,num(r.porzioni)||1);
    const i=S.recipes.findIndex(x=>x.id===r.id);
    delete r._new;
    if(i>=0)S.recipes[i]=r;else S.recipes.push(r);
    ui.editing=null;ui.open=r.id;ui.porz=null;await save();render();toast('Ricetta salvata');
  }
  if(a==='delrec'){
    if(!confirm('Eliminare "'+(ui.editing.nome||'ricetta')+'"?'))return;
    S.recipes=S.recipes.filter(x=>x.id!==ui.editing.id);
    ui.editing=null;ui.open=null;await save();render();toast('Ricetta eliminata');
  }
  if(a==='addfood'){
    const nf={id:uid(),nome:'Nuovo alimento',u:'g',kcal:0,p:0,c:0,g:0};
    S.foods.push(nf);ui.foodOpen=nf.id;await save();render();
  }
  if(a==='delfood'){
    const f=food(b.dataset.id);
    if(!confirm('Eliminare "'+f.nome+'"?'))return;
    S.foods=S.foods.filter(x=>x.id!==b.dataset.id);ui.foodOpen=null;await save();render();
  }
  if(a==='export'){
    const blob=new Blob([JSON.stringify({v:1,foods:S.foods,recipes:S.recipes},null,2)],{type:'application/json'});
    const a2=document.createElement('a');
    a2.href=URL.createObjectURL(blob);
    a2.download='ricettario-'+new Date().toISOString().slice(0,10)+'.json';
    a2.click();URL.revokeObjectURL(a2.href);
  }
  if(a==='import')document.getElementById('file').click();
  if(a==='reset'){
    if(!confirm('Cancellare tutto e ripristinare i dati iniziali?'))return;
    S=seed();ui.open=null;ui.editing=null;await save();render();toast('Dati ripristinati');
  }
});

/* input: modifica in tempo reale */
document.getElementById('view').addEventListener('input',async e=>{
  const t=e.target,k=t.dataset.k;

  if(t.dataset.act==='porz'){ui.porz=Math.max(1,Math.round(num(t.value))||1);
    const r=S.recipes.find(x=>x.id===ui.open);renderMacrosOnly(r);return;}

  if(t.dataset.sk&&ui.scan&&ui.scan.dati){
    const k=t.dataset.sk;
    ui.scan.dati[k]=(k==='nome'||k==='u')?t.value:num(t.value);
    return;
  }
  if(t.dataset.fid){
    const f=food(t.dataset.fid);
    f[k]=(k==='nome'||k==='u')?t.value:num(t.value);
    clearTimeout(window.__t);window.__t=setTimeout(save,400);return;
  }
  if(!ui.editing||!k)return;
  const r=ui.editing;
  if(k==='nome')r.nome=t.value;
  else if(k==='porzioni')r.porzioni=num(t.value);
  else if(k==='note')r.note=t.value;
  else if(k==='passi')r.passi=t.value.split('\n').map(s=>s.trim()).filter(Boolean);
  else if(k==='gnome')r.gruppi[+t.dataset.g].nome=t.value;
  else if(k==='q')r.gruppi[+t.dataset.g].items[+t.dataset.i].q=num(t.value);
});
document.getElementById('view').addEventListener('change',e=>{
  const t=e.target;
  if(ui.editing&&t.dataset.k==='f')
    ui.editing.gruppi[+t.dataset.g].items[+t.dataset.i].f=t.value;
});

/* ricalcolo senza perdere il focus sullo stepper */
function renderMacrosOnly(r){
  if(!r)return;
  const base=Math.max(1,num(r.porzioni)||1),p=Math.max(1,ui.porz||base),fatt=p/base;
  const tot=calc(r,fatt),d=ui.perPorzione?p:1;
  const box=document.querySelector('.macros');
  if(box)box.innerHTML=macroCells({kcal:tot.kcal/d,p:tot.p/d,c:tot.c/d,g:tot.g/d});
  const f2=document.querySelector('.factor');
  if(f2)f2.textContent='Ricetta base per '+base+' · quantità × '+fmt(fatt,2);
  const sub=document.querySelectorAll('.sect > p');
  if(sub[1])sub[1].textContent='Quantità già calcolate per '+p+(p===1?' porzione.':' porzioni.');
  document.querySelectorAll('.grp').forEach((gEl,gi)=>{
    const gr=r.gruppi[gi];if(!gr)return;
    gEl.querySelectorAll('ul.ing li').forEach((li,ii)=>{
      const it=gr.items[ii];if(!it)return;
      const q=num(it.q)*fatt,span=li.querySelector('.q');
      span.textContent=fmt(q,q<10?1:0)+' '+((food(it.f)||{}).u||'g');
      span.className=q<1?'q warnq':'q';
    });
  });
}

function filtraAlimenti(v){
  const t=v.trim().toLowerCase();
  document.querySelectorAll('.foodrow').forEach(el=>{
    el.style.display=(!t||el.dataset.nome.indexOf(t)>=0)?'':'none';
  });
}

/* import additivo */
document.addEventListener('change',async e=>{
  if(e.target.id!=='file'||!e.target.files.length)return;
  try{
    const d=JSON.parse(await e.target.files[0].text());
    let nf=0,nr=0;
    (d.foods||[]).forEach(f=>{
      if(S.foods.some(x=>x.nome.toLowerCase()===String(f.nome).toLowerCase()))return;
      S.foods.push({...f,id:uid()});nf++;
    });
    (d.recipes||[]).forEach(r=>{
      const dup=S.recipes.some(x=>x.nome.toLowerCase()===String(r.nome).toLowerCase());
      const map={};(d.foods||[]).forEach(f=>{
        const m=S.foods.find(x=>x.nome.toLowerCase()===String(f.nome).toLowerCase());
        if(m)map[f.id]=m.id;
      });
      const copy=JSON.parse(JSON.stringify(r));
      copy.id=uid();
      if(dup)copy.nome=r.nome+' (importata)';
      (copy.gruppi||[]).forEach(g=>g.items.forEach(it=>{if(map[it.f])it.f=map[it.f];}));
      S.recipes.push(copy);nr++;
    });
    await save();render();toast(nr+' ricette e '+nf+' alimenti aggiunti');
  }catch(err){toast('File non valido');}
  e.target.value='';
});

boot();
</script>
