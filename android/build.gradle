// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// La compilazione scrive fuori da OneDrive.
//
// Il progetto sta dentro una cartella sincronizzata, e OneDrive tiene aperti i
// file mentre li carica: Gradle prova a cancellare le cartelle temporanee e
// trova la porta chiusa, la compilazione muore. Fuori di li' il problema non
// esiste, e in piu' si smette di sincronizzare centinaia di MB di roba usa e
// getta.
def fuoriDaOneDrive = new File(System.getenv('LOCALAPPDATA') ?: System.getProperty('java.io.tmpdir'), 'etp-health-build')

allprojects {
    layout.buildDirectory = new File(fuoriDaOneDrive, project.path.replace(':', '_'))
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
